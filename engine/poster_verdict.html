<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
/*ENGINE_CSS*/
*{animation:none!important}
body{width:var(--W);height:var(--H);background:#050505;color:#fff;font-family:Inter,sans-serif}
.root{position:absolute;inset:0;overflow:hidden}
.p{position:absolute;left:-30%;width:160%;height:70%;transform:skewY(-14deg)}
.p.h{top:-24%;background:var(--ch)}.p.a{bottom:-24%;background:var(--ca)}
.st{position:absolute;inset:0;background:repeating-linear-gradient(-14deg,rgba(255,255,255,.045) 0 3px,transparent 3px 26px)}
.sh{position:absolute;inset:0;background:radial-gradient(ellipse 90% 60% at 50% 45%,rgba(0,0,0,.35),rgba(0,0,0,.82)),linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.15) 30%,rgba(0,0,0,.25) 70%,rgba(0,0,0,.85))}
.wrap{position:absolute;inset:0;padding:56px 60px;display:flex;flex-direction:column;justify-content:space-between}
.hd{display:flex;justify-content:space-between;align-items:center}
.hd img{height:44px}
.hd .chip{font-size:20px;padding:10px 20px}
.V{font-family:'Inter Display',Inter,sans-serif;font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:-3px;line-height:.9;white-space:nowrap}
.kick{font-size:24px;font-weight:800;letter-spacing:4px;text-transform:uppercase;display:flex;align-items:center;gap:12px;color:rgba(255,255,255,.85)}
.kick::before{content:'';width:13px;height:13px;background:var(--accent)}
.tn{font-size:140px;overflow:hidden}
.vsr{display:flex;align-items:center;gap:18px;margin:14px 0}
.vsr i{flex:1;height:3px;background:rgba(255,255,255,.35)}
.vsr b{font-family:'Inter Display';font-weight:900;font-style:italic;font-size:34px;background:#fff;color:#000;padding:4px 16px;transform:skewX(-10deg)}
.verd{align-self:flex-start;background:#fff;color:#0a0a0a;padding:16px 26px 20px;transform:rotate(-3deg);box-shadow:0 24px 60px rgba(0,0,0,.6);margin-top:26px;max-width:100%}
.verd small{display:block;font-size:19px;font-weight:800;letter-spacing:3px;color:var(--accent);margin-bottom:6px}
.verd .V{font-size:84px}.verd em{font-style:italic;color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.box{background:rgba(10,10,10,.72);border:2px solid rgba(255,255,255,.14);border-radius:28px;padding:24px 28px}
.box .kick{font-size:18px;letter-spacing:3px}
.box .V{font-size:96px;margin-top:12px}
.box .V span{color:var(--accent)}
.box p{font-size:22px;font-weight:600;color:rgba(255,255,255,.8);margin-top:10px;line-height:1.3}
.ft{display:flex;justify-content:space-between;align-items:center;gap:20px}
.ft .ask{font-family:'Inter Display';font-weight:900;font-style:italic;font-size:44px;text-transform:uppercase;line-height:.95}
.ft .ask span{color:var(--accent)}
.ft .note{font-size:18px;color:rgba(255,255,255,.7);margin-top:8px;font-weight:600}
.ft .url{background:var(--accent);color:#fff;font-size:34px;font-weight:800;border-radius:999px;padding:16px 36px;flex:none}
</style>
</head>
<body>
<script>
const D=__DATA__,P=D.platform;
/*ENGINE_JS*/
document.body.style.setProperty('--W',P.w+'px');document.body.style.setProperty('--H',P.h+'px');
const mx=Math.max(...D.probs),sc=D.score.split('-'),nm=s=>s.toUpperCase();
const fb=String(D.fact.big).replace(/([–\-\/%])/g,'<span>$1</span>');
document.body.insertAdjacentHTML('afterbegin',`<div class="root" style="--ch:${D.colors.home};--ca:${D.colors.away}"><div class="p h"></div><div class="p a"></div><div class="st"></div><div class="sh"></div>
<div class="wrap">
 <div class="hd"><img data-logo><div class="chip">Model verdict</div></div>
 <div style="display:flex;flex-direction:column">
  <div class="kick">${D.league} · ${D.whenPoster||D.when}</div>
  <div class="tn V" style="margin-top:22px">${nm(D.home)}</div>
  <div class="vsr"><i></i><b>VS</b><i></i></div>
  <div class="tn V">${nm(D.away)}</div>
  <div class="verd"><small>MODEL VERDICT</small><div class="V">${nm(D.pick)} <em>${mx}%</em></div></div>
 </div>
 <div class="row2">
  <div class="box"><div class="kick">Most likely score</div><div class="V">${sc[0]}<span>–</span>${sc[1]}</div><p>${D.scorePct}% model probability</p></div>
  <div class="box"><div class="kick">${D.fact.label}</div><div class="V">${fb}</div><p>${D.fact.line.replace('<br>',' ')}</p></div>
 </div>
 <div class="ft"><div><div class="ask">${D.ask.replace('<br>',' ')}</div><div class="note">${P.name=='pinterest'?'Full prediction at varim.net':'Comment your score below'} · Model estimate, not a guarantee. 18+</div></div><div class="url">varim.net</div></div>
</div></div>`);
document.documentElement.style.setProperty('--logo',`url(${LOGO})`);
document.querySelectorAll('[data-logo]').forEach(i=>i.src=LOGO);
fit('.tn',70);fit('.verd .V',50);fit('.box .V',50);
</script>
</body>
</html>
