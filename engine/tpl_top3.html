<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
/*ENGINE_CSS*/
.ghost{position:absolute;font-weight:900;line-height:.8;color:transparent;-webkit-text-stroke:3px rgba(255,255,255,.09);pointer-events:none;letter-spacing:-20px}
/* s1 */
#s1 .in{justify-content:flex-start}
#s1 .ghost{font-size:1300px;right:-120px;top:-170px}
#s1 .three{font-size:420px;font-weight:900;line-height:.82;color:var(--accent);letter-spacing:-20px;text-shadow:0 0 90px rgba(230,0,35,.6);align-self:flex-start}
#s1 .burst{width:300px;height:300px;left:40px;top:120px}
#s1 .t1{font-size:120px;font-weight:900;letter-spacing:-5px;line-height:.95;text-transform:uppercase;margin-top:10px}
#s1 .t2{font-size:52px;font-weight:700;color:var(--muted);margin-top:24px;letter-spacing:-1px}
#s1 .teams{display:flex;align-items:center;gap:22px;margin-top:56px}
#s1 .teams .flag{width:120px;height:80px;border-radius:12px}
#s1 .teams b{font-size:60px;font-weight:800;letter-spacing:-2px}
#s1 .teams i{font-style:italic;font-size:36px;font-weight:900;color:var(--accent-text)}
#s1 .meta{margin-top:40px;font-size:32px;font-weight:600;color:var(--muted)}
/* заголовок пункта */
.numh{display:flex;align-items:flex-end;gap:28px;position:relative}
.num{font-size:250px;font-weight:900;line-height:.78;letter-spacing:-12px;color:transparent;-webkit-text-stroke:5px var(--accent);flex:none}
.nt{font-size:64px;font-weight:800;letter-spacing:-2.5px;line-height:1.02;padding-bottom:4px}
.rule{height:4px;background:var(--border);margin:32px 0 6px;transform-origin:left;animation:fill .6s var(--ease) both;animation-delay:.35s}
/* #3 форма */
.frow{display:flex;flex-direction:column;gap:22px;padding:34px 38px;margin-top:22px;border-radius:36px}
.frow .h{display:flex;align-items:center;gap:18px;font-size:46px;font-weight:800;letter-spacing:-1px}
.frow .h .flag{width:66px;height:44px;border-radius:8px}
.frow .h em{margin-left:auto;font-style:normal;font-size:30px;font-weight:800;letter-spacing:2px;text-transform:uppercase;padding:10px 20px;border-radius:999px}
.frow .h em.good{background:var(--win-bg);color:var(--win)}
.frow .h em.bad{background:var(--loss-bg);color:var(--accent-text)}
.frow.hot{animation:fl .7s var(--ease) both,hot .5s var(--ease) forwards;animation-delay:var(--d),2.4s}
@keyframes hot{to{border-color:var(--win);box-shadow:0 0 50px rgba(84,213,138,.25)}}
/* #2 личная встреча */
#s3 .in{position:relative}
.hscore{display:flex;align-items:center;justify-content:center;gap:30px;margin-top:30px;position:relative}
.hscore .tm{display:flex;flex-direction:column;align-items:center;gap:18px;width:190px}
.hscore .tm .flag{width:150px;height:100px;border-radius:14px}
.hscore .tm b{font-size:38px;font-weight:800}
.hscore .d{white-space:nowrap;font-size:210px;font-weight:900;letter-spacing:-12px;line-height:.9}
.hscore .d span{color:var(--accent);margin:0 18px}
#s3 .burst{width:320px;height:320px;left:calc(50% - 160px);top:60px}
.when2{text-align:center;font-size:32px;font-weight:600;color:var(--muted);margin-top:22px}
.tbl{margin-top:26px;padding:10px 38px;border-radius:32px}
.tbl .r{display:grid;grid-template-columns:70px 66px 1fr auto;align-items:center;gap:20px;padding:16px 0;font-size:40px;font-weight:700}
.tbl .r + .r{border-top:2px solid var(--border)}
.tbl .r .p{font-size:40px;font-weight:900;color:var(--muted)}
.tbl .r .flag{width:66px;height:44px;border-radius:8px}
.tbl .r .pts{font-weight:800}
.tbl .r .pts small{font-size:26px;color:var(--muted);font-weight:700;margin-left:8px}
.tbl .r.lead .p{color:var(--accent)}
/* #1 модель */
.mbig{display:flex;align-items:baseline;gap:26px;margin-top:40px;position:relative}
.mbig .v{font-size:300px;font-weight:900;letter-spacing:-14px;line-height:.85;text-shadow:0 0 90px rgba(230,0,35,.55)}
.mbig .v small{font-size:140px;letter-spacing:0}
.mbig .k{font-size:44px;font-weight:800;line-height:1.1;letter-spacing:-1px}
.mbig .k span{display:block;font-size:28px;font-weight:700;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:10px}
.br{margin-top:30px}
.br .h{display:flex;justify-content:space-between;font-size:36px;font-weight:700;color:var(--muted)}
.br .h b{color:var(--text);font-weight:800}
.br .bar{height:22px;border-radius:11px;background:var(--surface2);margin-top:12px}
.br .bar i{display:block;height:100%;border-radius:11px;background:#85858e;width:var(--w);transform-origin:left;animation:fill 1s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d)}
.br.best .bar i{background:var(--accent);box-shadow:0 0 40px rgba(230,0,35,.7)}
.ms{margin-top:44px;display:flex;justify-content:space-between;align-items:center;padding:30px 40px;border-radius:32px}
.ms .s{font-size:72px;font-weight:900;letter-spacing:-3px}
.ms .s small{font-size:32px;font-weight:700;color:var(--muted);letter-spacing:0;margin-left:16px}
/* финал */
.cta .ask{margin-top:30px;font-size:40px;font-weight:600;color:var(--muted)}
.cta .ask b{color:var(--text)}
</style>
</head>
<body>
<script>
const D=__DATA__;
/*ENGINE_JS*/
const H=D.home,A=D.away,sc=D.score.split('-');
const names=[H,'Draw',A], mx=Math.max(...D.probs);
const frow=(t,f,tag,good,cls,d,hot)=>`<div class="card frow ${hot?'hot':cls}" style="--d:${d}s"><div class="h">${flag(t)}${t}<em class="${good?'good':'bad'}">${tag}</em></div><div class="pills">${pills(f,d+.25)}</div></div>`;
const L=D.table;
document.body.insertAdjacentHTML('afterbegin',`
<section class="scene" id="s1" style="--dur:3.5s;--t0:0s;--shake:.62s"><div class="body"><div class="in">
  <div class="ghost">3</div>
  <div class="three now">3</div><div class="burst" style="--d:.2s"></div>
  <div class="t1 now">stats to know</div>
  <div class="t2 a" style="--d:.05s">before kick-off tonight</div>
  <div class="teams a" style="--d:.05s">${flag(H,'sh')}<b>${H}</b><i>VS</i><b>${A}</b>${flag(A,'sh')}</div>
  <div class="meta a" style="--d:.05s">${D.league} · ${D.when}</div>
</div></div></section>

<section class="scene" id="s2" style="--dur:5s;--t0:3.5s"><div class="body"><div class="in">
  <div class="numh a" style="--d:.15s"><div class="num">#3</div><div class="nt">${D.stat3}</div></div>
  <div class="rule"></div>
  ${frow(A,D.formAway,D.tagAway,true,'fl',.5,true)}
  ${frow(H,D.formHome,D.tagHome,false,'fr2',1.0,false)}
</div></div></section>

<section class="scene" id="s3" style="--dur:4.5s;--t0:8.5s;--shake:.78s"><div class="body"><div class="in">
  <div class="numh a" style="--d:.15s"><div class="num">#2</div><div class="nt">${D.stat2}</div></div>
  <div class="rule"></div>
  <div class="hscore"><div class="burst" style="--d:.78s"></div>
    <div class="tm fl" style="--d:.3s">${flag(D.h2h.a)}<b>${D.h2h.a}</b></div>
    <div class="d slam" style="--d:.55s">${D.h2h.ga}<span>–</span>${D.h2h.gb}</div>
    <div class="tm fr2" style="--d:.35s">${flag(D.h2h.b)}<b>${D.h2h.b}</b></div>
  </div>
  <div class="when2 a" style="--d:1s">${D.h2h.date} · ${D.league}</div>
  <div class="card tbl a" style="--d:1.4s">
    <div class="label" style="margin-top:22px">${D.group}</div>
    ${L.map((r,i)=>`<div class="r ${i==0?'lead':''}"><div class="p">${r[0]}</div>${flag(r[1])}<div>${r[1]}</div><div class="pts">${r[2]}<small>pts</small></div></div>`).join('')}
  </div>
</div></div></section>

<section class="scene" id="s4" style="--dur:4.5s;--t0:13s"><div class="body"><div class="in">
  <div class="numh a" style="--d:.15s"><div class="num">#1</div><div class="nt">The model backs ${D.pick}</div></div>
  <div class="rule"></div>
  <div class="mbig"><div class="v slam" style="--d:.35s"><span class="count" style="--to:${mx};--d:.35s"></span><small>%</small></div><div class="k a" style="--d:.7s">${D.pick} win<span>Model probability</span></div></div>
  ${D.probs.map((p,i)=>`<div class="br ${p==mx?'best':''} a" style="--d:${1.1+i*.15}s"><div class="h"><span>${names[i]}</span><b>${p}%</b></div><div class="bar"><i style="--w:${p}%;--d:${1.2+i*.15}s"></i></div></div>`).join('')}
  <div class="card ms a" style="--d:1.95s"><div class="label">Most likely score</div><div class="s">${sc[0]}–${sc[1]}<small>${D.scorePct}%</small></div></div>
</div></div></section>

<section class="scene" id="s5" style="--dur:3.5s;--t0:17.5s;--shake:.55s"><div class="body" style="bottom:430px"><div class="in cta">
  <div class="burst" style="--d:.5s"></div>
  <div class="lg"><img data-logo><i></i></div>
  <h2 class="a" style="--d:.8s">${D.pick} at ${mx}%.<br>Agree?</h2>
  <div class="ask a" style="--d:.95s">Comment <b>1</b>, <b>X</b> or <b>2</b></div>
  <div class="url">varim.net</div>
  <div class="note a" style="--d:1.5s">An estimate is not a guarantee of the result.</div>
</div></div></section>`);
ENGINE({chip:'3 stats',ticker:['Model prediction',D.league,`${H} vs ${A}`,D.when,'varim.net']});
</script>
</body>
</html>
