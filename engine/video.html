<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@property --n{syntax:'<integer>';initial-value:0;inherits:false}
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080808;--surface:#131313;--surface2:#202020;--border:#39393f;--text:#fafafa;--muted:#bdbdc4;--accent:#e60023;--accent-text:#ff6b7f;--win:#54d58a;--win-bg:#10251b;--loss-bg:#35161c;--ease:cubic-bezier(.16,1,.3,1)}
body{width:1080px;height:1920px;background:var(--bg);color:var(--text);font-family:Inter,sans-serif;overflow:hidden;font-feature-settings:'tnum';-webkit-font-smoothing:antialiased}
.scene{display:none;position:absolute;inset:0;overflow:hidden}
.scene.on{display:block}
/* ---------- фон ---------- */
.fx{position:absolute;inset:0}
.glow{position:absolute;width:1500px;height:1500px;left:-210px;top:210px;background:radial-gradient(closest-side,rgba(230,0,35,.26),transparent);animation:drift 14s ease-in-out infinite alternate;animation-delay:calc(-1*var(--t0))}
@keyframes drift{from{transform:translate(-300px,-460px)}to{transform:translate(300px,560px)}}
.grid{position:absolute;inset:-200px;background:repeating-linear-gradient(115deg,rgba(255,255,255,.03) 0 2px,transparent 2px 140px);animation:slide 9s linear infinite;animation-delay:calc(-1*var(--t0))}
@keyframes slide{to{transform:translateX(154.47px)}}
.ring{position:absolute;width:800px;height:800px;left:140px;top:560px;border-radius:50%;border:2px solid rgba(255,255,255,.06);animation:breath 7s ease-in-out infinite alternate;animation-delay:calc(-1*var(--t0))}
.ring.b{width:1240px;height:1240px;left:-80px;top:340px;border-color:rgba(255,255,255,.035);animation-duration:9s}
@keyframes breath{from{transform:scale(.94)}to{transform:scale(1.06)}}
.dot{position:absolute;bottom:-30px;background:#fff;animation:float linear infinite}
@keyframes float{0%{transform:translateY(0);opacity:0}15%{opacity:var(--o)}85%{opacity:var(--o)}100%{transform:translateY(-2050px);opacity:0}}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 50%,rgba(0,0,0,.62))}
/* ---------- шапка ---------- */
.prog{display:none}
.prog b{flex:1;height:6px;border-radius:3px;background:#2d2d2d;overflow:hidden;position:relative}
.prog b.done::after,.prog b.cur::after{content:'';position:absolute;inset:0;background:var(--text);border-radius:3px}
.prog b.cur::after{transform-origin:left;animation:fill var(--dur) linear both}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.top{position:absolute;left:84px;right:84px;top:150px;display:flex;justify-content:space-between;align-items:center}
.top img{height:50px;display:block}
.chip{font-size:23px;font-weight:700;letter-spacing:2.4px;text-transform:uppercase;color:var(--muted);border:2px solid var(--border);border-radius:999px;padding:12px 24px;background:var(--surface);display:flex;align-items:center;gap:12px}
.chip::before{content:'';width:12px;height:12px;background:var(--accent);animation:blink 1s steps(2,jump-none) infinite}
@keyframes blink{from{opacity:1}to{opacity:.25}}
/* ---------- тикер ---------- */
.tick{position:absolute;left:0;right:0;top:1404px;height:68px;background:var(--surface);border-top:2px solid var(--border);border-bottom:2px solid var(--border);overflow:hidden;display:flex;align-items:center}
.tick .tr{display:flex;white-space:nowrap;animation:tick 26s linear infinite;animation-delay:calc(-1*var(--t0))}
.tick span{font-size:25px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center}
.tick span::after{content:'';width:12px;height:12px;background:var(--accent);margin:0 32px}
@keyframes tick{to{transform:translateX(-50%)}}
/* ---------- переходы ---------- */
.wipe{position:absolute;top:-10%;left:-40%;width:180%;height:120%;transform:translateX(-125%) skewX(-14deg);z-index:50;background:var(--accent)}
.wipe.k{background:#7a0013;z-index:49}
.wipe.io{animation:win .5s cubic-bezier(.7,0,.2,1) both,wout .4s cubic-bezier(.5,0,.8,.6) forwards;animation-delay:0s,calc(var(--dur) - .4s)}
.wipe.k.io{animation-delay:.09s,calc(var(--dur) - .4s)}
.wipe.o{animation:wout .4s cubic-bezier(.5,0,.8,.6) forwards;animation-delay:calc(var(--dur) - .4s)}
.wipe.i{animation:win .5s cubic-bezier(.7,0,.2,1) both}
.wipe.k.i{animation-delay:.09s}
@keyframes wout{from{transform:translateX(-125%) skewX(-14deg)}to{transform:translateX(0) skewX(-14deg)}}
@keyframes win{from{transform:translateX(0) skewX(-14deg)}to{transform:translateX(125%) skewX(-14deg)}}
/* ---------- общее ---------- */
.body{position:absolute;left:84px;right:84px;top:292px;bottom:540px;animation:push var(--dur) linear both;transform-origin:50% 40%}
@keyframes push{from{transform:scale(1)}to{transform:scale(1.045)}}
.in{height:100%;display:flex;flex-direction:column;animation:shake .26s linear both;animation-delay:var(--shake,99s)}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-12px,9px)}40%{transform:translate(10px,-8px)}60%{transform:translate(-7px,5px)}80%{transform:translate(4px,-3px)}}
.a{animation:in .7s var(--ease) both;animation-delay:var(--d,0s)}
@keyframes in{from{opacity:0;transform:translateY(60px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
.fl{animation:fl .7s var(--ease) both;animation-delay:var(--d,0s)}
@keyframes fl{from{opacity:0;transform:translateX(-140px);filter:blur(14px)}to{opacity:1;transform:none;filter:blur(0)}}
.fr2{animation:frr .7s var(--ease) both;animation-delay:var(--d,0s)}
@keyframes frr{from{opacity:0;transform:translateX(140px);filter:blur(14px)}to{opacity:1;transform:none;filter:blur(0)}}
.pop{animation:pop .6s cubic-bezier(.2,1.4,.3,1) both;animation-delay:var(--d,0s)}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
.flip{animation:flip .55s cubic-bezier(.2,1.2,.3,1) both;animation-delay:var(--d,0s)}
@keyframes flip{from{opacity:0;transform:perspective(600px) rotateX(-90deg)}to{opacity:1;transform:perspective(600px) rotateX(0)}}
.ch{display:inline-block;animation:chin .65s var(--ease) both;animation-delay:calc(var(--d,0s) + var(--i)*.035s)}
@keyframes chin{from{opacity:0;transform:translateY(70%) scale(1.25);filter:blur(14px)}to{opacity:1;transform:none;filter:blur(0)}}
.count{animation:count 1.1s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s);counter-reset:n var(--n)}
.count::after{content:counter(n)}
@keyframes count{from{--n:0}to{--n:var(--to)}}
.burst{position:absolute;border-radius:50%;border:6px solid var(--accent);opacity:0;animation:burst .8s cubic-bezier(.1,.7,.3,1) both;animation-delay:var(--d)}
@keyframes burst{from{opacity:.9;transform:scale(.2)}to{opacity:0;transform:scale(2.6)}}
.label{font-size:28px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:16px}
.label::before{content:'';width:14px;height:14px;background:var(--accent)}
.flag{display:flex;flex-direction:column;overflow:hidden;border-radius:14px;box-shadow:0 0 0 2px rgba(255,255,255,.16),0 24px 60px rgba(0,0,0,.6);position:relative}
.flag svg{width:100%;height:100%;display:block}
.flag.sh::after{content:'';position:absolute;top:0;bottom:0;left:0;width:45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-120%);animation:shine .9s ease-out both;animation-delay:calc(var(--d,0s) + .45s)}
@keyframes shine{from{transform:translateX(-120%)}to{transform:translateX(340%)}}
.de u:nth-child(1){background:#111}.de u:nth-child(2){background:#dd0000}.de u:nth-child(3){background:#ffce00}
.nl u:nth-child(1){background:#ae1c28}.nl u:nth-child(2){background:#fff}.nl u:nth-child(3){background:#21468b}
.card{background:rgba(19,19,19,.92);border:2px solid var(--border);border-radius:40px;padding:44px}
.mh{display:flex;align-items:center;gap:22px;margin-bottom:52px}
.mh .flag{width:72px;height:48px;border-radius:8px;box-shadow:0 0 0 2px rgba(255,255,255,.16)}
.mh .t{font-size:42px;font-weight:700;letter-spacing:-1px}
.mh .t span{color:var(--accent-text);font-weight:800;font-size:28px;letter-spacing:2px;margin:0 14px;vertical-align:4px}
/* ---------- s1 ---------- */
#s1 .in{align-items:center;text-align:center;padding-top:24px;position:relative}
#s1 .flag{width:310px;height:206px;border-radius:22px}
#s1 .team{font-size:124px;font-weight:800;letter-spacing:-5px;line-height:1;margin-top:26px}
#s1 .vsw{position:relative;width:100%;margin:40px 0;display:flex;align-items:center;gap:26px}
#s1 .vsw i{flex:1;height:2px;background:var(--border);animation:fill .6s var(--ease) both;animation-delay:.55s}
#s1 .vsw i:first-child{transform-origin:right}#s1 .vsw i:last-child{transform-origin:left}
#s1 .vs{font-size:52px;font-weight:900;font-style:italic;letter-spacing:3px;color:#fff;background:var(--accent);padding:8px 26px;transform:skewX(-10deg);animation:stamp .45s cubic-bezier(.2,1.2,.3,1) both;animation-delay:.42s;box-shadow:0 0 60px rgba(230,0,35,.7)}
@keyframes stamp{from{opacity:0;transform:skewX(-10deg) scale(3.4)}to{opacity:1;transform:skewX(-10deg) scale(1)}}
#s1 .burst{width:220px;height:220px;left:calc(50% - 110px);top:-82px}
#s1 .when{margin-top:56px;font-size:34px;font-weight:600;color:var(--muted);letter-spacing:.5px}
#s1 .q{margin-top:20px;font-size:60px;font-weight:800;letter-spacing:-2px;line-height:1.08}
#s1 .q em{font-style:normal;position:relative;white-space:nowrap}
#s1 .q em::after{content:'';position:absolute;left:0;right:0;bottom:-8px;height:10px;background:var(--accent);transform-origin:left;animation:fill .5s var(--ease) both;animation-delay:2s}
/* ---------- s2 ---------- */
.row{margin-top:50px}
.row .h{display:flex;justify-content:space-between;align-items:baseline}
.row .nm{font-size:50px;font-weight:700;letter-spacing:-1px}
.row .pc{font-size:116px;font-weight:800;letter-spacing:-5px;line-height:1}
.row .pc small{font-size:58px;letter-spacing:0;margin-left:4px}
.row.dim .nm,.row.dim .pc{color:var(--muted)}
.row.top1 .pc{text-shadow:0 0 70px rgba(230,0,35,.75)}
.bar{height:28px;border-radius:14px;background:var(--surface2);margin-top:18px;position:relative}
.bar i{display:block;height:100%;border-radius:14px;background:#85858e;width:var(--w);transform-origin:left;animation:fill 1.1s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d);position:relative;overflow:hidden}
.row.top1 .bar i{background:var(--accent);box-shadow:0 0 44px rgba(230,0,35,.8)}
.bar i::after{content:'';position:absolute;top:0;bottom:0;left:0;width:30%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);animation:shine 1s ease-out both;animation-delay:calc(var(--d) + .9s);transform:translateX(-120%)}
.pick{margin-top:58px;display:flex;justify-content:space-between;align-items:center;padding:36px 44px;position:relative;border-color:var(--accent);box-shadow:0 0 0 0 rgba(230,0,35,.6);animation:pop .6s cubic-bezier(.2,1.4,.3,1) both,pulse 1.2s ease-out 2;animation-delay:var(--d),calc(var(--d) + .3s)}
@keyframes pulse{from{box-shadow:0 0 0 0 rgba(230,0,35,.65)}to{box-shadow:0 0 0 44px rgba(230,0,35,0)}}
.pick .v{font-size:56px;font-weight:800;letter-spacing:-1.5px;margin-top:10px;display:flex;align-items:center;gap:20px}
.pick .v .flag{width:66px;height:44px;border-radius:7px;box-shadow:0 0 0 2px rgba(255,255,255,.16)}
.pick .tag{background:var(--accent);color:#fff;font-size:44px;font-weight:800;letter-spacing:-1px;border-radius:999px;padding:16px 34px}
/* ---------- s3 ---------- */
#s3 .label{justify-content:center}
#s3 .scw{position:relative;display:flex;justify-content:center;align-items:center;gap:40px;margin-top:4px;height:400px}
#s3 .scw::before{content:'';position:absolute;width:820px;height:820px;left:calc(50% - 410px);top:-210px;background:radial-gradient(closest-side,rgba(230,0,35,.5),transparent);animation:pop .8s ease-out both,breath 1.4s ease-in-out infinite alternate;animation-delay:.55s,1.35s}
#s3 .dg{font-size:420px;font-weight:800;letter-spacing:-16px;line-height:.95;position:relative;text-shadow:0 20px 80px rgba(0,0,0,.7)}
#s3 .dg.l{animation:dropT .55s cubic-bezier(.3,1.5,.4,1) both;animation-delay:.4s}
#s3 .dg.r{animation:dropB .55s cubic-bezier(.3,1.5,.4,1) both;animation-delay:.5s}
@keyframes dropT{from{opacity:0;transform:translateY(-420px) scale(1.5);filter:blur(24px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes dropB{from{opacity:0;transform:translateY(420px) scale(1.5);filter:blur(24px)}to{opacity:1;transform:none;filter:blur(0)}}
#s3 .dash{width:120px;height:28px;background:var(--accent);position:relative;animation:fill .4s var(--ease) both;animation-delay:.8s;transform-origin:center;box-shadow:0 0 50px rgba(230,0,35,.9)}
#s3 .burst{width:360px;height:360px;left:calc(50% - 180px);top:20px}
#s3 .sub{text-align:center;font-size:36px;font-weight:600;color:var(--muted);margin-top:14px}
#s3 .sub b{color:var(--text);font-weight:800}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:44px}
.sc{background:rgba(19,19,19,.92);border:2px solid var(--border);border-radius:28px;padding:22px 0;text-align:center}
.sc b{display:block;font-size:50px;font-weight:800;letter-spacing:-1px}
.sc s{display:block;text-decoration:none;font-size:28px;font-weight:600;color:var(--muted);margin-top:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.tile{padding:30px 36px;border-radius:28px}
.tile b{display:block;font-size:80px;font-weight:800;letter-spacing:-3px;line-height:1}
.tile s{display:block;text-decoration:none;font-size:30px;font-weight:600;color:var(--muted);margin-top:10px}
/* ---------- s4 ---------- */
.fc{padding:34px 40px;margin-top:22px}
.fc .n{display:flex;align-items:center;gap:18px;font-size:44px;font-weight:700;letter-spacing:-1px}
.fc .n .flag{width:60px;height:40px;border-radius:7px;box-shadow:0 0 0 2px rgba(255,255,255,.16)}
.fc .n small{margin-left:auto;font-size:28px;font-weight:700;color:var(--muted);letter-spacing:0}
.pills{display:flex;gap:16px;margin-top:26px}
.pills b{width:100px;height:100px;border-radius:24px;display:grid;place-items:center;font-size:48px;font-weight:800;border:2px solid var(--border);background:var(--surface2);color:var(--muted)}
.pills b.w{background:var(--win-bg);color:var(--win);border-color:#1f5a3a;box-shadow:0 0 30px rgba(84,213,138,.18)}
.pills b.l{background:var(--loss-bg);color:var(--accent-text);border-color:#6b2431}
.fc .last{font-size:30px;font-weight:500;color:var(--muted);margin-top:24px}
.fc .last b{color:var(--text);font-weight:700}
.h2h{margin-top:22px;padding:32px 40px}
.h2h .r{margin-top:14px;font-size:46px;font-weight:700;letter-spacing:-.5px;display:flex;align-items:center;gap:18px}
.h2h .r b{font-weight:800;background:var(--accent);color:#fff;padding:2px 18px;border-radius:12px}
/* ---------- s5 ---------- */
#s5 .body{bottom:430px}
#s5 .in{align-items:center;justify-content:center;text-align:center;position:relative}
#s5 .lg{position:relative;width:640px;height:138px;animation:logo .8s cubic-bezier(.2,1.2,.3,1) both;animation-delay:.3s}
@keyframes logo{from{opacity:0;transform:scale(1.9);filter:blur(30px)}to{opacity:1;transform:none;filter:blur(0)}}
#s5 .lg img{width:100%;height:100%;display:block}
#s5 .lg i{position:absolute;inset:0;-webkit-mask:var(--logo) center/100% 100% no-repeat;mask:var(--logo) center/100% 100% no-repeat;overflow:hidden}
#s5 .lg i::after{content:'';position:absolute;top:0;bottom:0;left:0;width:36%;background:linear-gradient(100deg,transparent,#fff,transparent);opacity:.95;transform:translateX(-120%);animation:shine 1s ease-in-out both;animation-delay:1s}
#s5 .burst{width:420px;height:420px;left:calc(50% - 210px);top:calc(50% - 440px)}
#s5 h2{font-size:80px;font-weight:800;letter-spacing:-3px;line-height:1.04;margin-top:64px}
#s5 .url{margin-top:56px;background:var(--accent);color:#fff;font-size:62px;font-weight:800;letter-spacing:-1px;border-radius:999px;padding:30px 72px;animation:pop .6s cubic-bezier(.2,1.4,.3,1) both,pulse 1.1s ease-out 2;animation-delay:1.1s,1.5s}
#s5 .note{margin-top:60px;font-size:28px;font-weight:500;color:var(--muted)}
</style>
</head>
<body>

<script>
const D=__DATA__;
const FLAGS={
 Germany:'<rect width="3" height="2" fill="#111"/><rect y=".667" width="3" height=".667" fill="#d00"/><rect y="1.333" width="3" height=".667" fill="#ffce00"/>',
 Netherlands:'<rect width="3" height="2" fill="#ae1c28"/><rect y=".667" width="3" height=".667" fill="#fff"/><rect y="1.333" width="3" height=".667" fill="#21468b"/>',
 Switzerland:'<rect width="3" height="2" fill="#da291c"/><rect x="1.3" y=".4" width=".4" height="1.2" fill="#fff"/><rect x=".9" y=".8" width="1.2" height=".4" fill="#fff"/>',
 Scotland:'<rect width="3" height="2" fill="#005eb8"/><path d="M0 0L3 2M3 0L0 2" stroke="#fff" stroke-width=".36"/>'
};
const flag=(t,cls='',st='')=>`<div class="flag ${cls}" style="${st}"><svg viewBox="0 0 3 2" preserveAspectRatio="none">${FLAGS[t]||'<rect width="3" height="2" fill="#39393f"/>'}</svg></div>`;
const H=D.home,A=D.away;
const mh=`<div class="mh a" style="--d:.25s">${flag(H)}${flag(A)}<div class="t">${H}<span>VS</span>${A}</div></div>`;
const row=(cls,nm,p,d)=>`<div class="row ${cls} fl" style="--d:${d}s"><div class="h"><div class="nm">${nm}</div><div class="pc"><span class="count" style="--to:${p};--d:${d+.15}s"></span><small>%</small></div></div><div class="bar"><i style="--w:${p}%;--d:${d+.15}s"></i></div></div>`;
const mx=Math.max(...D.probs);
const names=[`${H} win`,'Draw',`${A} win`];
const pills=(f,d0)=>f.map((r,i)=>`<b class="${r=='W'?'w':r=='L'?'l':''} flip" style="--d:${(d0+i*.08).toFixed(2)}s">${r}</b>`).join('');
const fc=(t,f,last,stat,cls,d)=>`<div class="card fc ${cls}" style="--d:${d}s"><div class="n">${flag(t)}${t}${stat?`<small>${stat}</small>`:''}</div><div class="pills">${pills(f,d+.25)}</div><div class="last">Last match: <b>${last}</b></div></div>`;
const sc=D.score.split('-');
document.body.insertAdjacentHTML('afterbegin',`
<section class="scene" id="s1" style="--dur:3.5s;--t0:0s;--shake:.6s"><div class="body"><div class="in">
  <div class="label a">${D.league}</div>
  ${flag(H,'sh fl','--d:.1s;margin-top:40px')}
  <div class="team" data-split style="--d:.18s">${H}</div>
  <div class="vsw"><i></i><div class="vs">VS</div><i></i><div class="burst" style="--d:.6s"></div></div>
  ${flag(A,'sh fr2','--d:.75s')}
  <div class="team" data-split style="--d:.85s">${A}</div>
  <div class="when a" style="--d:1.35s">${D.when}</div>
  <div class="q a" style="--d:1.6s">Who does the <em>model</em> favour?</div>
</div></div></section>
<section class="scene" id="s2" style="--dur:5s;--t0:3.5s"><div class="body"><div class="in">
  ${mh}<div class="label a" style="--d:.3s">Win probability</div>
  ${D.probs.map((p,i)=>row(p==mx?'top1':'dim',names[i],p,.45+i*.25)).join('')}
  <div class="card pick" style="--d:2.4s"><div><div class="label">Model pick</div><div class="v">${FLAGS[D.pick]?flag(D.pick):''}${D.pick}</div></div><div class="tag">${D.pickPct}%</div></div>
</div></div></section>
<section class="scene" id="s3" style="--dur:4.5s;--t0:8.5s;--shake:.78s"><div class="body"><div class="in">
  ${mh}<div class="label a" style="--d:.3s">Most likely score</div>
  <div class="scw"><div class="burst" style="--d:.78s"></div><div class="dg l">${sc[0]}</div><div class="dash"></div><div class="dg r">${sc[1]}</div></div>
  <div class="sub a" style="--d:1.1s">model probability — <b>${D.scorePct}%</b></div>
  <div class="chips">${D.others.map((o,i)=>`<div class="sc flip" style="--d:${1.5+i*.1}s"><b>${o[0].replace('-','–')}</b><s>${o[1]}%</s></div>`).join('')}</div>
  <div class="tiles">
    <div class="card tile a" style="--d:2.2s"><b><span class="count" style="--to:${D.over25};--d:2.3s"></span>%</b><s>Over 2.5 goals</s></div>
    <div class="card tile a" style="--d:2.35s"><b><span class="count" style="--to:${D.btts};--d:2.45s"></span>%</b><s>Both teams to score</s></div>
  </div>
</div></div></section>
<section class="scene" id="s4" style="--dur:4.5s;--t0:13s"><div class="body"><div class="in">
  ${mh}<div class="label a" style="--d:.3s">Form · last 5 matches</div>
  ${fc(H,D.formHome,D.lastHome,D.statHome,'fl',.45)}
  ${fc(A,D.formAway,D.lastAway,D.statAway,'fr2',1.2)}
  ${D.h2h?`<div class="card h2h a" style="--d:2.2s"><div class="label">Head to head · ${D.h2h.date}</div><div class="r">${D.h2h.a}<b>${D.h2h.score}</b>${D.h2h.b}</div></div>`:''}
</div></div></section>
<section class="scene" id="s5" style="--dur:3.5s;--t0:17.5s;--shake:.55s"><div class="body"><div class="in">
  <div class="burst" style="--d:.5s"></div>
  <div class="lg"><img data-logo><i></i></div>
  <h2 class="a" style="--d:.8s">Full prediction<br>&amp; match stats</h2>
  <div class="url">varim.net</div>
  <div class="note a" style="--d:1.5s">An estimate is not a guarantee of the result.</div>
</div></div></section>`);
const LOGO='__LOGO__';
document.documentElement.style.setProperty('--logo',`url(${LOGO})`);
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const dots=Array.from({length:18},()=>{const s=4+rnd()*6|0;return `<i class="dot" style="left:${rnd()*100}%;width:${s}px;height:${s}px;--o:${(.12+rnd()*.3).toFixed(2)};animation-duration:${(7+rnd()*8).toFixed(1)}s;animation-delay:calc(-${(rnd()*15).toFixed(1)}s - var(--t0))"></i>`}).join('');
const tk=`<span>Model prediction</span><span>${D.league}</span><span>${H} vs ${A}</span><span>${D.when}</span><span>varim.net</span>`;
document.querySelectorAll('.scene').forEach((s,i,all)=>{
  const last=i==all.length-1;
  const prog=[...all].map((_,j)=>`<b class="${j<i?'done':j==i?'cur':''}"></b>`).join('');
  s.insertAdjacentHTML('afterbegin',`<div class="fx"><div class="glow"></div><div class="grid"></div><div class="ring b"></div><div class="ring"></div>${dots}<div class="vig"></div></div>`);
  s.insertAdjacentHTML('beforeend',`<div class="prog">${prog}</div>`+(last?'':`<div class="top"><img data-logo><div class="chip">Model prediction</div></div><div class="tick"><div class="tr">${tk.repeat(6)}</div></div>`)
   +`<div class="wipe k ${i==0?'o':last?'i':'io'}"></div><div class="wipe ${i==0?'o':last?'i':'io'}"></div>`);
});
document.querySelectorAll('[data-logo]').forEach(i=>i.src=LOGO);
document.querySelectorAll('[data-split]').forEach(e=>{e.innerHTML=[...e.textContent].map((c,i)=>`<span class="ch" style="--i:${i}">${c}</span>`).join('')});
document.getElementById(location.hash.slice(1)||'s1').classList.add('on');
window.seek=t=>{document.getAnimations().forEach(a=>{a.pause();a.currentTime=t})};
</script>
</body>
</html>
