<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
/*ENGINE_CSS*/
.qtag{align-self:center;background:var(--accent);color:#fff;font-size:30px;font-weight:800;letter-spacing:3px;text-transform:uppercase;padding:16px 34px;border-radius:999px}
#s2 .in,#s3 .in,#s4 .in{justify-content:center;padding-bottom:40px}
/* s1 */
#s1 .in{align-items:center;text-align:center;justify-content:flex-start}
.duel{display:flex;align-items:center;gap:44px;margin-top:70px;position:relative}
.duel .flag{width:280px;height:190px;border-radius:24px}
.duel .qm{font-size:230px;font-weight:900;color:var(--accent);line-height:1;width:120px}
#s1 .burst{width:260px;height:260px;left:calc(50% - 130px);top:-40px}
#s1 h1{font-size:104px;font-weight:800;letter-spacing:-4px;line-height:1.02;margin-top:40px}
#s1 .sub{font-size:38px;font-weight:600;color:var(--muted);margin-top:30px;line-height:1.3}
/* s2 — варианты ответа */
.qh{display:flex;justify-content:space-between;align-items:center}
.qh .q{font-size:64px;font-weight:800;letter-spacing:-2px}
.timer{width:110px;height:110px;position:relative;display:grid;place-items:center;font-size:44px;font-weight:800}
.timer svg{position:absolute;inset:0;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:9}
.timer .bg{stroke:var(--surface2)}
.timer .fg{stroke:var(--accent);stroke-dasharray:314;animation:tdown 2.2s linear both;animation-delay:.2s}
@keyframes tdown{from{stroke-dashoffset:0}to{stroke-dashoffset:314}}
.tnum{position:relative;height:54px;width:40px;overflow:hidden}
.tnum span{position:absolute;inset:0;text-align:center;line-height:54px;opacity:0;animation:tn .73s steps(1,end) both;animation-delay:var(--d)}
.tnum span:last-child{animation:tnl .3s both;animation-delay:var(--d)}
@keyframes tn{0%{opacity:1}99%{opacity:1}100%{opacity:0}}
@keyframes tnl{from{opacity:0;transform:scale(1.6)}to{opacity:1;transform:none}}
.opt{position:relative;margin-top:28px;height:168px;border-radius:36px;background:var(--surface);border:3px solid var(--border);display:flex;align-items:center;gap:30px;padding:0 40px;overflow:hidden;box-shadow:0 8px 24px rgba(5,18,48,.08)}
.opt .fillb{position:absolute;left:0;top:0;bottom:0;width:var(--w);background:var(--surface2);transform-origin:left;animation:fill 1.1s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--fd)}
.opt > *:not(.fillb){position:relative}
.opt .ltr{width:84px;height:84px;border-radius:50%;background:#051230;color:#fff;display:grid;place-items:center;font-size:40px;font-weight:800;flex:none}
.opt .flag{width:84px;height:56px;border-radius:10px}
.opt .nm{font-size:54px;font-weight:800;letter-spacing:-1.5px;flex:1}
.opt .pc{font-size:72px;font-weight:800;letter-spacing:-3px;opacity:0;animation:in .4s var(--ease) both;animation-delay:var(--fd)}
.opt.win{animation:winb .5s var(--ease) both,pulse 1.2s ease-out 2;animation-delay:2.4s,2.6s}
@keyframes winb{to{border-color:var(--accent);transform:scale(1.03)}}
.opt.win .fillb{background:#fff1e4}
.opt.win .ltr{animation:winl .4s both;animation-delay:2.4s}
@keyframes winl{to{background:var(--accent)}}
.opt.lose{animation:lose .5s both;animation-delay:2.4s}
@keyframes lose{to{opacity:.55}}
.mtag{position:relative;white-space:nowrap;background:var(--accent);color:#fff;font-size:20px;font-weight:800;letter-spacing:2px;padding:6px 14px;border-radius:999px;animation:pop .5s cubic-bezier(.2,1.4,.3,1) both;animation-delay:2.5s}
/* s3 — подсказка */
#s3 .in{align-items:center}
.clue{font-size:72px;font-weight:800;letter-spacing:-2.5px;text-align:center;margin-top:26px;line-height:1.04}
.gauges{display:flex;gap:40px;margin-top:56px;position:relative}
.gauge{width:400px;padding:36px 0 34px;display:flex;flex-direction:column;align-items:center;border-radius:40px}
.ringg{width:280px;height:280px;position:relative;display:grid;place-items:center}
.ringg svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ringg circle{fill:none;stroke-width:26;stroke-linecap:round}
.ringg .bg{stroke:var(--surface2)}
.ringg .fg{stroke:var(--accent);stroke-dasharray:754;stroke-dashoffset:754;animation:gauge 1.1s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d)}
@keyframes gauge{to{stroke-dashoffset:calc(754 * (1 - var(--p)))}}
.ringg b{font-size:96px;font-weight:800;letter-spacing:-4px}
.ringg b small{font-size:48px;letter-spacing:0}
.gauge s{text-decoration:none;font-size:34px;font-weight:700;margin-top:22px}
#s3 .burst{width:300px;height:300px;left:calc(50% - 150px);top:120px}
.h2hq{width:100%;margin-top:32px;padding:30px 40px;border-radius:32px}
.h2hq .r{margin-top:12px;font-size:46px;font-weight:700;display:flex;align-items:center;gap:18px}
.h2hq .r b{background:#051230;color:#fff;padding:2px 18px;border-radius:12px;font-weight:800}
/* s4 — ответ */
#s4 .in{align-items:center;text-align:center}
.rev{position:relative;width:720px;height:420px;margin-top:40px;perspective:1600px}
.rev > div{position:absolute;inset:0;border-radius:48px;display:grid;place-items:center;backface-visibility:hidden}
.rev .front{background:#051230;color:#fff;font-size:300px;font-weight:900;animation:fout .35s ease-in both;animation-delay:.35s}
@keyframes fout{to{transform:rotateY(90deg)}}
.rev .back{background:var(--surface);border:4px solid var(--accent);font-size:300px;font-weight:900;letter-spacing:-12px;transform:rotateY(-90deg);animation:fin .45s cubic-bezier(.2,1.3,.3,1) forwards;animation-delay:.7s;box-shadow:0 30px 70px rgba(204,18,54,.22)}
@keyframes fin{to{transform:rotateY(0)}}
#s4 .prob{font-size:38px;font-weight:600;color:var(--muted);margin-top:30px}
#s4 .prob b{color:var(--text);font-weight:800}
.runner{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:100%;margin-top:40px}
.runner div{background:var(--surface);border:2px solid var(--border);border-radius:28px;padding:22px 0;box-shadow:0 8px 24px rgba(5,18,48,.06)}
.runner b{display:block;font-size:54px;font-weight:800;letter-spacing:-1px}
.runner s{display:block;text-decoration:none;font-size:28px;font-weight:600;color:var(--muted);margin-top:4px}
#s4 .right{margin-top:40px;font-size:52px;font-weight:800;letter-spacing:-1.5px;color:var(--accent)}
/* s5 — тёмно-синий финал */
#s5{background:#051230;--text:#f6f8fc;--muted:#bac8df;--fx-dot:#fff;--fx-ring:rgba(255,255,255,.07);--fx-ring2:rgba(255,255,255,.04);--fx-line:rgba(255,255,255,.03);--fx-glow:rgba(204,18,54,.3);color:var(--text)}
.cta .ask{margin-top:30px;font-size:40px;font-weight:600;color:var(--muted)}
</style>
</head>
<body>
<script>
const D=__DATA__;
/*ENGINE_JS*/
const H=D.home,A=D.away;
const sc=D.score.split('-');
const names=[H,'Draw',A], mx=Math.max(...D.probs);
const opt=(i,d)=>{const p=D.probs[i],win=p==mx;return `<div class="opt ${win?'win':'lose'} fl" style="--d:${d}s;--w:${p}%;--fd:${.6+i*.15}s"><div class="fillb"></div><div class="ltr">${'ABC'[i]}</div>${i==1?'':flag(names[i])}<div class="nm">${names[i]}</div>${win?'<div class="mtag">MODEL PICK</div>':''}<div class="pc">${p}%</div></div>`};
const gauge=(p,lab,d)=>`<div class="card gauge pop" style="--d:${d}s"><div class="ringg"><svg viewBox="0 0 280 280"><circle class="bg" cx="140" cy="140" r="120"/><circle class="fg" cx="140" cy="140" r="120" style="--p:${p/100};--d:${d+.15}s"/></svg><b><span class="count" style="--to:${p};--d:${d+.15}s"></span><small>%</small></b></div><s>${lab}</s></div>`;
document.body.insertAdjacentHTML('afterbegin',`
<section class="scene" id="s1" style="--dur:3.5s;--t0:0s;--shake:.62s"><div class="body"><div class="in">
  <div class="qtag" style="--d:0s">Predict the score</div>
  <h1 class="now">${H} or ${A}?</h1>
  <div class="duel">${flag(H,'sh fl','--d:.05s')}<div class="qm slam" style="--d:.05s">?</div>${flag(A,'sh fr2','--d:.05s')}<div class="burst" style="--d:.3s"></div></div>
  <div class="sub a" style="--d:.05s">Make your call —<br>then see what the model says</div>
</div></div></section>

<section class="scene" id="s2" style="--dur:5s;--t0:3.5s"><div class="body"><div class="in">
  <div class="qh a" style="--d:.2s"><div><div class="label">Question 1</div><div class="q" style="margin-top:10px">Who wins?</div></div>
    <div class="timer"><svg viewBox="0 0 110 110"><circle class="bg" cx="55" cy="55" r="50"/><circle class="fg" cx="55" cy="55" r="50"/></svg><div class="tnum"><span style="--d:.2s">3</span><span style="--d:.93s">2</span><span style="--d:1.66s">1</span><span style="--d:2.39s;color:var(--accent)">✓</span></div></div></div>
  ${opt(0,.35)}${opt(1,.45)}${opt(2,.55)}
</div></div></section>

<section class="scene" id="s3" style="--dur:4.5s;--t0:8.5s;--shake:.78s"><div class="body"><div class="in">
  <div class="label a" style="--d:.2s">Clue</div>
  <div class="clue a" style="--d:.3s">${D.clue}</div>
  <div class="gauges"><div class="burst" style="--d:.78s"></div>${gauge(D.over25,'Over 2.5 goals',.6)}${gauge(D.btts,'Both teams score',.75)}</div>
  <div class="card h2hq a" style="--d:1.9s"><div class="label">Last meeting · ${D.h2h.date}</div><div class="r">${D.h2h.a}<b>${D.h2h.score}</b>${D.h2h.b}</div></div>
</div></div></section>

<section class="scene" id="s4" style="--dur:4.5s;--t0:13s"><div class="body"><div class="in">
  <div class="label a" style="--d:.15s">The model's answer</div>
  <div class="rev a" style="--d:.1s"><div class="front">?</div><div class="back">${sc[0]}–${sc[1]}</div></div>
  <div class="prob a" style="--d:1s">most likely score — <b>${D.scorePct}%</b></div>
  <div class="runner">${D.others.map((o,i)=>`<div class="flip" style="--d:${1.2+i*.12}s"><b>${o[0].replace('-','–')}</b><s>${o[1]}%</s></div>`).join('')}</div>
  <div class="right a" style="--d:1.95s">Did you get it right?</div>
</div></div></section>

<section class="scene" id="s5" style="--dur:3.5s;--t0:17.5s;--shake:.55s"><div class="body" style="bottom:430px"><div class="in cta">
  <div class="burst" style="--d:.5s"></div>
  <div class="lg"><img data-logo><i></i></div>
  <h2 class="a" style="--d:.8s">What's your score?</h2>
  <div class="ask a" style="--d:.95s">Drop it in the comments</div>
  <div class="url">varim.net</div>
  <div class="note a" style="--d:1.5s">An estimate is not a guarantee of the result.</div>
</div></div></section>`);
ENGINE({light:true,chip:'Score quiz'});
</script>
</body>
</html>
