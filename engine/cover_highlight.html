<!doctype html><html><head><meta charset="utf-8"><style>

*{margin:0;padding:0;box-sizing:border-box}

.bg{position:absolute;inset:0;background:radial-gradient(circle 760px at 50% 46%,var(--a) 0%,var(--b) 62%,var(--c) 100%)}

.lab{position:absolute;left:0;right:0;top:1580px;text-align:center;font-family:BS;font-size:96px;letter-spacing:14px;color:#fff;opacity:.92}
