<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#161412;--red:#b3001b;--paper:#efe7d6}
body{width:1080px;height:1920px;overflow:hidden;background:#d9cfbb;font-family:Lora,serif;color:var(--ink)}
.scene{position:absolute;inset:0;display:none}
.scene.on{display:block}
/* бумага */
.paper{position:absolute;inset:0;background:radial-gradient(ellipse 120% 90% at 50% 40%,#f3ecdc 0%,#e9dfca 70%,#d8ccb3 100%)}
.paper::before{content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(0,0,0,.085) 1.2px,transparent 1.7px) 0 0/9px 9px;mix-blend-mode:multiply}
.paper::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.05),transparent 8%,transparent 92%,rgba(0,0,0,.06))}
.under{position:absolute;inset:0}
.sheet{position:absolute;inset:0;transform-origin:0% 100%;box-shadow:0 0 80px rgba(0,0,0,.35)}
.sheet.out{animation:turn .38s cubic-bezier(.6,0,.9,.5) calc(var(--dur) - .38s) both}
@keyframes turn{to{transform:translateX(-112%) rotate(-9deg)}}
.zoom{position:absolute;inset:0;animation:zoom var(--dur) linear both}
@keyframes zoom{from{transform:scale(1.035)}to{transform:scale(1)}}
.wrap{position:absolute;left:70px;right:70px;top:150px;bottom:420px;display:flex;flex-direction:column}
.mast{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:7px double var(--ink);padding-bottom:16px}
.mast img{height:50px;filter:brightness(0)}
.mast span{font-family:Inter;font-size:24px;font-weight:700;letter-spacing:3px;text-transform:uppercase}
.kick{font-family:Inter;font-weight:800;font-size:28px;letter-spacing:5px;text-transform:uppercase;color:var(--red);margin-top:42px}
.rule{height:3px;background:var(--ink);transform-origin:left}
/* анимации */
.ln{display:block;overflow:hidden;padding-bottom:.16em;margin-bottom:-.1em}
.ln>span{display:block;animation:rise .55s cubic-bezier(.2,.9,.2,1) var(--d) both}
@keyframes rise{from{transform:translateY(105%)}}
.up{animation:up .5s cubic-bezier(.2,.9,.2,1) var(--d) both}
@keyframes up{from{transform:translateY(50px);opacity:0}}
.ink{animation:ink .45s ease-out var(--d) both}
@keyframes ink{from{opacity:0;filter:blur(10px);transform:scale(1.06)}}
.draw{animation:draw .45s cubic-bezier(.6,0,.3,1) var(--d) both}
@keyframes draw{from{transform:scaleX(0)}}
.slam{animation:slam .32s cubic-bezier(.3,1.6,.5,1) var(--d) both}
@keyframes slam{from{transform:scale(1.9);opacity:0}}
.jolt{animation:jolt .3s ease-out var(--d) both}
@keyframes jolt{0%{transform:translate(0,0)}25%{transform:translate(-7px,9px)}55%{transform:translate(5px,-4px)}100%{transform:translate(0,0)}}
/* s1 */
h1{font-size:112px;line-height:.98;font-weight:700;letter-spacing:-3.5px;margin-top:22px}
h1 i,.it{font-style:italic;color:var(--red)}
.score{display:flex;align-items:center;justify-content:space-between;margin-top:56px;padding:30px 0;position:relative}
.score .t{font-family:Inter;font-weight:900;font-size:58px;letter-spacing:-1px;text-transform:uppercase}
.score .n{font-size:230px;font-weight:700;line-height:.88;letter-spacing:-6px}
.score .rule{position:absolute;left:0;right:0}
.score .rule.a{top:0}.score .rule.b{bottom:0}
.deck{margin-top:46px;font-size:64px;font-style:italic;font-weight:600;line-height:1.05}
.deck span{color:var(--red)}
/* s2 */
.lab{font-family:Inter;font-weight:900;font-size:30px;letter-spacing:6px;text-transform:uppercase;color:var(--red);margin-top:46px}
.big{font-size:150px;font-weight:700;letter-spacing:-4px;line-height:.95;margin-top:16px}
.rows{margin-top:80px;display:flex;flex-direction:column;gap:44px}
.row{display:grid;grid-template-columns:250px 1fr 150px;align-items:center;gap:26px}
.row .nm{font-family:Inter;font-weight:900;font-size:42px;text-transform:uppercase;letter-spacing:-.5px}
.row .tr{height:80px;border:3px solid var(--ink);position:relative;overflow:hidden}
.row .fl{position:absolute;inset:0;width:var(--w);background:repeating-linear-gradient(-45deg,var(--ink) 0 6px,transparent 6px 12px);transform-origin:left;animation:draw .8s cubic-bezier(.3,0,.2,1) var(--d) both}
.row.pk .fl{background:var(--red)}
.row .pc{font-size:72px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.row.pk .pc{color:var(--red)}
.stampbox{position:relative;height:330px;margin-top:90px}
.stamp{position:absolute;right:30px;top:40px;transform:rotate(-11deg)}
.stamp div{border:12px solid var(--red);color:var(--red);font-family:Inter;font-weight:900;font-size:130px;letter-spacing:3px;padding:14px 46px;text-transform:uppercase;border-radius:18px;mix-blend-mode:multiply;opacity:.93;
 -webkit-mask:radial-gradient(circle at 30% 40%,#000 55%,rgba(0,0,0,.75) 56%) ,repeating-linear-gradient(80deg,#000 0 9px,rgba(0,0,0,.82) 9px 11px);-webkit-mask-composite:source-in}
.stamp.no div{color:var(--ink);border-color:var(--ink)}
/* s3 */
.pair{display:flex;flex-direction:column;gap:20px;margin-top:56px}
.cell{display:flex;align-items:baseline;justify-content:space-between;border-bottom:3px solid var(--ink);padding-bottom:14px}
.cell b{font-family:Inter;font-weight:900;font-size:36px;letter-spacing:5px;text-transform:uppercase}
.cell .v{font-size:210px;font-weight:700;letter-spacing:-6px;line-height:.9;position:relative}
.cell.m .v{color:#8d8577}
.strike{position:absolute;left:-14px;right:-14px;top:48%;height:16px;background:var(--red);border-radius:8px;transform:rotate(-8deg);transform-origin:left}
.strike i{display:block;height:100%;background:inherit;border-radius:inherit;animation:draw .35s cubic-bezier(.6,0,.3,1) var(--d) both;transform-origin:left}
.strike{background:none}.strike i{background:var(--red)}
.story{margin-top:52px;font-size:84px;font-style:italic;font-weight:700;line-height:1.02;letter-spacing:-1.5px}
.sub{font-family:Inter;font-weight:700;font-size:36px;margin-top:22px;color:#4a443c}
/* s4 */
.cta{font-size:230px;font-weight:700;line-height:.88;letter-spacing:-8px;margin-top:90px}
.cta span{font-style:italic;color:var(--red);display:block}
.ad{margin-top:110px;border:5px solid var(--ink);padding:36px 40px;display:flex;flex-direction:column;gap:18px;position:relative}
.ad::before{content:'';position:absolute;inset:8px;border:2px solid var(--ink);pointer-events:none}
.ad .h{font-family:Inter;font-weight:900;font-size:30px;letter-spacing:6px;color:var(--red);text-transform:uppercase}
.ad .u{font-size:120px;font-weight:700;letter-spacing:-2px}
.ad .f{font-family:Inter;font-weight:700;font-size:34px}
.foot{margin-top:auto;font-family:Inter;font-weight:800;font-size:32px;display:flex;justify-content:space-between;border-top:2px solid var(--ink);padding-top:18px}
</style></head>
<body>
<div id="root"></div>
<script>
const D=__DATA__;const LOGO='__LOGO__';
const P=D.paper, S=D.scenes;
const fs=D.final.split('-'), ms=D.score.split('-');
const mast=`<div class="mast"><img src="${LOGO}"><span>${P.date}</span></div>`;
const L=(h,d)=>`<span class="ln"><span style="--d:${d}s">${h}</span></span>`;
const names=[D.home,'Draw',D.away], pk=D.probs.indexOf(Math.max(...D.probs));
const sc={
s1:`<div class="kick">${D.league} · Full time</div>
 <h1>${P.headline.map((h,i)=>L(h,-.25+i*.12)).join('')}</h1>
 <div class="score"><div class="rule a draw" style="--d:.6s"></div>
  <span class="t up" style="--d:.85s">${D.home}</span><span class="n slam" style="--d:.95s">${fs[0]}–${fs[1]}</span><span class="t up" style="--d:.85s">${D.away}</span>
  <div class="rule b draw" style="--d:.6s"></div></div>
 <div class="deck">${L(P.hook,1.6)}</div>`,
s2:`<div class="lab up" style="--d:.05s">The model said</div>
 <div class="big">${L(D.pick+' to win.',.15)}</div>
 <div class="rows">${[2,1,0].map((k,i)=>`<div class="row ${k==pk?'pk':''} up" style="--d:${.35+i*.08}s"><span class="nm">${names[k]}</span><span class="tr"><span class="fl" style="--w:${D.probs[k]}%;--d:${.5+i*.08}s"></span></span><span class="pc" data-to="${D.probs[k]}" data-d="${.5+i*.08}">0%</span></div>`).join('')}</div>
 <div class="stampbox"><div class="stamp ${D.pickOk?'':'no'}"><div class="slam" style="--d:1.75s">${D.pickOk?'Called it':'Missed'}</div></div></div>`,
s3:`<div class="lab up" style="--d:.05s">Exact score</div>
 <div class="pair">
  <div class="cell m up" style="--d:.15s"><b>Model</b><span class="v">${ms[0]}–${ms[1]}<span class="strike"><i style="--d:.75s"></i></span></span></div>
  <div class="cell up" style="--d:1.0s"><b>Final</b><span class="v">${fs[0]}–${fs[1]}</span></div></div>
 <div class="story">${P.story.map((h,i)=>L(h,1.5+i*.12)).join('')}</div>
 <div class="sub up" style="--d:2.0s">${D.story.sub}</div>`,
s4:`<div class="cta">${L('Watch',.1)}${L('<span>the goals</span>',.25)}</div>
 <div class="ad ink" style="--d:.7s"><div class="h">Full highlights</div><div class="u">varim.net</div><div class="f">Follow for tomorrow's picks</div></div>
 <div class="foot up" style="--d:1.2s"><span>VARiM · Matchday edition</span><span>18+</span></div>`
};
const keys=Object.keys(S);
document.getElementById('root').innerHTML=keys.map((k,i)=>{
 const last=i==keys.length-1;
 return `<section class="scene" id="${k}" style="--dur:${S[k]}s">
 <div class="under"><div class="paper"></div><div class="wrap">${mast}</div></div>
 <div class="sheet ${last?'':'out'}"><div class="paper"></div><div class="zoom ${k=='s2'?'':''}"><div class="wrap ${k=='s2'?'jolt':''}" style="--d:1.8s">${mast}${sc[k]}</div></div></div></section>`}).join('');
const id=location.hash.slice(1)||'s1';document.getElementById(id).classList.add('on');
const cnt=[...document.querySelectorAll('#'+id+' [data-to]')];
window.seek=t=>{document.getAnimations().forEach(a=>{a.pause();a.currentTime=t});
 const s=t/1000;cnt.forEach(e=>{const p=Math.min(Math.max((s-e.dataset.d)/.8,0),1);e.textContent=Math.round(e.dataset.to*(1-Math.pow(1-p,3)))+'%'})};
seek(0);
</script></body></html>
