<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
/*ENGINE_CSS*/
/* ===== Verdict 12: 12 с, 4 сцены, цвета команд, phonk 140 BPM ===== */
.fx{display:none}
.scene .body{top:400px;bottom:400px}
body{background:#050505}
.vbg{position:absolute;inset:0;overflow:hidden}
.vbg .p{position:absolute;left:-30%;width:160%;height:70%;transform:skewY(-14deg)}
.vbg .p.h{top:-22%;background:var(--ch);animation:ph 12s linear both;animation-delay:calc(-1*var(--t0))}
.vbg .p.a{bottom:-22%;background:var(--ca);animation:pa 12s linear both;animation-delay:calc(-1*var(--t0))}
@keyframes ph{from{transform:skewY(-14deg) translateX(-3%)}to{transform:skewY(-14deg) translateX(3%)}}
@keyframes pa{from{transform:skewY(-14deg) translateX(3%)}to{transform:skewY(-14deg) translateX(-3%)}}
.vbg .st{position:absolute;inset:-100px;background:repeating-linear-gradient(-14deg,rgba(255,255,255,.045) 0 3px,transparent 3px 26px);animation:sl 2s linear infinite;animation-delay:calc(-1*var(--t0))}
@keyframes sl{to{transform:translateY(26px)}}
.vbg .sh{position:absolute;inset:0;background:radial-gradient(ellipse 90% 60% at 50% 45%,rgba(0,0,0,.35),rgba(0,0,0,.82)),linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.15) 30%,rgba(0,0,0,.25) 70%,rgba(0,0,0,.85))}
.V{font-family:'Inter Display',Inter,sans-serif;font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:-3px;line-height:.9;white-space:nowrap}
.kick{font-size:30px;font-weight:800;letter-spacing:5px;text-transform:uppercase;color:rgba(255,255,255,.85);display:flex;align-items:center;gap:16px}
.kick::before{content:'';width:16px;height:16px;background:var(--accent)}
.settle{animation:settle .9s cubic-bezier(.16,1,.3,1) both}
@keyframes settle{from{transform:scale(1.08)}to{transform:none}}
/* s1 */
#s1 .in{justify-content:center;gap:0}
.hook{font-size:84px;letter-spacing:-3px;margin-top:22px;white-space:normal;line-height:.95}
.hook span{color:var(--accent)}
.tn{font-size:200px;max-width:100%;overflow:hidden;text-shadow:0 10px 60px rgba(0,0,0,.6)}
.tn.home{margin-top:40px}
.vsr{display:flex;align-items:center;gap:22px;margin:22px 0}
.vsr i{flex:1;height:4px;background:rgba(255,255,255,.35)}
.vsr b{font-family:'Inter Display';font-weight:900;font-style:italic;font-size:46px;background:#fff;color:#000;padding:6px 22px;transform:skewX(-10deg)}
.verd{position:relative;align-self:flex-start;margin-top:56px;background:#fff;color:#0a0a0a;padding:22px 34px 26px;transform:rotate(-3deg);box-shadow:0 30px 80px rgba(0,0,0,.6);max-width:100%}
.verd small{display:block;font-family:Inter;font-style:normal;font-size:24px;font-weight:800;letter-spacing:4px;color:var(--accent);margin-bottom:8px}
.verd .V{font-size:110px;letter-spacing:-4px}
.verd .V em{font-style:italic;color:var(--accent)}
#s1 .burst{width:320px;height:320px;left:260px;top:640px}
/* s2 */
#s2 .in{justify-content:center;align-items:center;text-align:center}
.sc{font-size:470px;letter-spacing:-20px;line-height:.85;margin-top:30px;display:flex;align-items:center;gap:36px;text-shadow:0 20px 90px rgba(0,0,0,.7)}
.sc i{display:block;width:110px;height:30px;background:var(--accent);transform:skewX(-14deg);box-shadow:0 0 60px rgba(230,0,35,.8)}
.pc{font-size:38px;font-weight:700;color:rgba(255,255,255,.85);margin-top:26px}
.pc b{color:#fff;font-weight:900}
.bars{width:100%;margin-top:70px}
.bars .row{display:flex;height:64px;gap:6px}
.bars .row div{height:100%;transform-origin:left;animation:fill .6s var(--ease) both;animation-delay:var(--d)}
.bars .lg2{display:flex;justify-content:space-between;margin-top:18px;font-size:30px;font-weight:800;text-transform:uppercase;letter-spacing:1px}
.bars .lg2 span{opacity:.9}
.bars .lg2 b{font-family:'Inter Display';font-style:italic;font-size:44px;margin-left:10px}
/* s3 */
#s3 .in{justify-content:center}
.big{font-size:400px;letter-spacing:-16px;line-height:.85;color:#fff;text-shadow:0 20px 90px rgba(0,0,0,.7);margin-top:40px}
.big span{color:var(--accent)}
.fl1{font-family:'Inter Display';font-weight:900;font-size:68px;line-height:1.02;letter-spacing:-2px;margin-top:40px;max-width:900px}
.fl2{font-size:36px;font-weight:600;color:rgba(255,255,255,.8);margin-top:24px}
#s3 .burst{width:360px;height:360px;left:120px;top:300px}
/* s4 */
#s4 .in{justify-content:center;align-items:center;text-align:center}
.ask{font-size:200px;letter-spacing:-8px;line-height:.86;width:100%;overflow:hidden}
.ask span{color:var(--accent)}
.cm{display:flex;align-items:center;gap:18px;font-size:44px;font-weight:800;margin-top:44px}
.cm svg{width:56px;height:56px;animation:bob .6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(12px)}}
#s4 .lg{width:460px;height:99px;margin-top:80px}
#s4 .url{margin-top:36px;background:var(--accent);color:#fff;font-size:52px;font-weight:800;border-radius:999px;padding:22px 60px;animation:pop .5s cubic-bezier(.2,1.4,.3,1) both,pulse 1.1s ease-out 2;animation-delay:1.1s,1.4s}
#s4 .note{margin-top:40px;font-size:26px;font-weight:600;color:rgba(255,255,255,.7)}
#s4 .burst{width:420px;height:420px;left:calc(50% - 210px);top:120px}

.fsc{font-size:300px;letter-spacing:-14px;line-height:.85;display:flex;align-items:center;gap:30px;margin-top:30px;text-shadow:0 20px 90px rgba(0,0,0,.7)}
.fsc i{display:block;width:90px;height:26px;background:#fff;transform:skewX(-14deg)}
.ftn{display:flex;justify-content:space-between;width:100%;font-family:'Inter Display';font-weight:900;font-style:italic;font-size:64px;text-transform:uppercase;letter-spacing:-2px;margin-top:10px}
.ok{display:inline-flex;align-items:center;gap:18px;margin-top:44px;padding:18px 34px;font-family:'Inter Display';font-weight:900;font-style:italic;font-size:92px;text-transform:uppercase;letter-spacing:-3px;transform:rotate(-4deg)}
.ok.yes{background:#1fbf5f;color:#04140a}.ok.no{background:#fff;color:#0a0a0a}
.ok svg{width:80px;height:80px}
.cmp{display:flex;gap:40px;align-items:flex-end;margin-top:40px}
.cmp div{display:flex;flex-direction:column;gap:10px}
.cmp small{font-size:28px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.8)}
.cmp b{font-family:'Inter Display';font-weight:900;font-style:italic;font-size:200px;line-height:.85;letter-spacing:-8px}
.cmp .was b{color:rgba(255,255,255,.45);text-decoration:line-through;text-decoration-thickness:12px;text-decoration-color:var(--accent)}
#s2 .in,#s3 .in{justify-content:center}
#s1 .in{justify-content:center;align-items:center;text-align:center}
</style>
</head>
<body>
<script>
const D=__DATA__;
/*ENGINE_JS*/
const H=D.home,A=D.away,CH=D.colors.home,CA=D.colors.away;
const sc=D.score.split('-'),mx=Math.max(...D.probs);
const T=[0,2.571,5.143,8.571,12];
const sec=(i,inner,shake)=>`<section class="scene" id="s${i+1}" style="--dur:${(T[i+1]-T[i]).toFixed(3)}s;--t0:${T[i]}s;--ch:${CH};--ca:${CA};${shake?`--shake:${shake}s`:''}"><div class="vbg"><div class="p h"></div><div class="p a"></div><div class="st"></div><div class="sh"></div></div><div class="body"><div class="in">${inner}</div></div></section>`;
const nm=s=>s.toUpperCase();
const factBig=String((D.fact||{}).big||'').replace(/([–\-\/%])/g,'<span>$1</span>');
const chk=ok=>ok?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l5 5L20 6"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const fs=D.final.split('-'), ex=D.score.split('-');
document.body.insertAdjacentHTML('afterbegin',
 sec(0,`<div class="kick">Full time · ${D.league}</div>
   <div class="ftn settle"><span>${nm(D.short.home)}</span><span>${nm(D.short.away)}</span></div>
   <div class="fsc V settle">${fs[0]}<i></i>${fs[1]}</div>
   <div class="hook V a" style="--d:.3s;margin-top:50px">${D.hook}</div>
   <div class="burst" style="--d:.43s"></div>`,.43)
+sec(1,`<div class="kick a" style="--d:0s">The model said</div>
   <div class="verd slam" style="--d:.1s;margin-top:30px"><small>PRE-MATCH VERDICT</small><div class="V">${nm(D.pick)} <em>${mx}%</em></div></div>
   <div class="ok ${D.pickOk?'yes':'no'} slam" style="--d:.35s">${chk(D.pickOk)}${D.pickOk?'Called it':'Missed'}</div>
   <div class="burst" style="--d:.43s"></div>`,.43)
+sec(2,`<div class="kick a" style="--d:0s">Exact score</div>
   <div class="cmp"><div class="was a" style="--d:.1s"><small>Model</small><b>${ex[0]}–${ex[1]}</b></div><div class="slam" style="--d:.3s"><small>Final</small><b>${fs[0]}–${fs[1]}</b></div></div>
   <div class="fl1 a" style="--d:.7s">${D.story.line}</div>
   <div class="fl2 a" style="--d:1.0s">${D.story.sub}</div>`,.43)
+sec(3,`<div class="burst" style="--d:.43s"></div>
   <div class="ask V slam" style="--d:.2s">${D.ask}</div>
   <div class="cm a" style="--d:.6s">Full highlights on varim.net</div>
   <div class="lg"><img data-logo><i></i></div>
   <div class="url">varim.net</div>
   <div class="note a" style="--d:1.3s">Follow for tomorrow's picks · 18+</div>`,.43));
ENGINE({chip:'Full time',ticker:[]});
fit('.tn',90);fit('.verd .V',60);fit('.fl1',44);fit('.ask',90);fit('.hook',50);
</script>
</body>
</html>
